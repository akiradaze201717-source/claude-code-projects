<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cramodoro — 集中学習タイマー</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b2545" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cramodoro" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <select class="lang" id="langSelect" title="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh">中文（简体）</option>
      <option value="zhHant">中文（繁體）</option>
      <option value="ko">한국어</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="tr">Türkçe</option>
      <option value="th">ไทย</option>
      <option value="vi">Tiếng Việt</option>
    </select>

    <div class="container">
      <div class="mode-label" id="modeLabel">集中</div>

      <div class="ring-wrapper">
        <svg class="ring" viewBox="0 0 260 260">
          <circle class="track" cx="130" cy="130" r="115" />
          <circle class="progress" id="progressRing" cx="130" cy="130" r="115" />
        </svg>
        <div class="time-display">
          <div class="time" id="timeDisplay">25:00</div>
          <div class="sessions" id="sessionsDisplay">セッション 1</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-icon" id="resetBtn" title="リセット">↺</button>
        <button class="btn-main" id="startBtn">スタート</button>
        <button class="btn-icon" id="skipBtn" title="スキップ">⏭</button>
      </div>

      <!-- 休憩中だけ：次回予告＋tips -->
      <div class="break-info" id="breakInfo"></div>

      <div class="count" id="countDisplay">完了 0 回</div>
      <div class="rank-badge" id="rankBadge"></div>
      <!-- 今日の目標 -->
      <div class="goal" id="goalDisplay"></div>

      <!-- 広告枠：休憩中のみ表示。Phase 2 で AdMob「バナー(静的)」のみ差し込む。動画広告は差し込まない。 -->
      <div class="ad-slot" id="adSlot">
        <span class="ad-tag" data-i18n="ad">広告</span>
      </div>
    </div>

    <div class="level-toast" id="levelToast"></div>
    <button class="log-btn" id="logBtn" title="学習ログ">📒</button>
    <button class="stats-btn" id="statsBtn" title="統計">📊</button>
    <button class="gear" id="gearBtn" title="設定">⚙</button>

    <div class="settings" id="statsOverlay">
      <div class="panel">
        <h2 data-i18n="statsTitle">統計</h2>
        <div class="rank-row">
          <span class="rank-ico" id="rankIco">🌱</span>
          <span class="rank-name" id="rankName">Rookie</span>
          <span class="rank-label" data-i18n="rank">ランク</span>
        </div>
        <div class="rank-bar"><div class="fill" id="rankFill"></div></div>
        <div class="rank-next" id="rankNext"></div>

        <div class="stat-grid" id="statGrid"></div>

        <div class="standing">
          <span data-i18n="standing">推定の立ち位置</span>
          <b id="standingVal">—</b>
        </div>

        <div class="range-row" id="rangeRow">
          <button data-range="7d">7D</button>
          <button data-range="14d">14D</button>
          <button data-range="30d">30D</button>
          <button data-range="6m">6M</button>
          <button data-range="1y">1Y</button>
          <button data-range="all">All</button>
        </div>
        <div class="hist" id="hist"></div>

        <div class="hint" id="estNote" data-i18n="estNote" style="margin-top: 14px"></div>
        <div class="panel-actions">
          <button class="btn-close" id="closeStatsBtn" data-i18n="close">閉じる</button>
        </div>
      </div>
    </div>

    <div class="settings" id="settings">
      <div class="panel">
        <h2 data-i18n="distTitle">集中時間の確率分布</h2>
        <div class="hint" data-i18n="hint">
          バーを上下にドラッグして、各時間（分）の出やすさを調整できます。範囲 1〜60 分・5分刻み。
        </div>
        <div class="presets">
          <span class="presets-label" data-i18n="presets">プリセット</span>
          <button data-preset="p15" data-min="15"></button>
          <button data-preset="p25" data-min="25"></button>
          <button data-preset="p45" data-min="45"></button>
          <button data-preset="p60" data-min="60"></button>
        </div>
        <div class="mean" id="distMean"></div>
        <div class="bars" id="bars"></div>
        <div class="bar-labels" id="barLabels"></div>
        <div class="save-row">
          <input id="customName" type="text" maxlength="20" data-i18n-ph="namePlaceholder" />
          <button class="btn-save-custom" id="saveCustomBtn" data-i18n="save">保存</button>
        </div>
        <div class="custom-list" id="customList"></div>

        <div class="break-settings">
          <label data-i18n="brkShort">短い休憩(分)</label
          ><input type="number" id="brkShortInput" min="1" max="60" inputmode="numeric" />
          <label data-i18n="brkLong">長い休憩(分)</label
          ><input type="number" id="brkLongInput" min="1" max="120" inputmode="numeric" />
          <label data-i18n="brkEvery">長休憩の間隔(回)</label
          ><input type="number" id="brkEveryInput" min="1" max="12" inputmode="numeric" />
        </div>

        <div class="opt-row">
          <span class="lbl" data-i18n="goalLabel">今日の目標</span>
          <select id="goalUnitSel"></select>
          <input type="number" id="goalInput" min="1" max="999" inputmode="numeric" />
        </div>
        <div class="opt-row">
          <span class="lbl" data-i18n="sound">音</span>
          <input type="checkbox" id="soundToggle" />
          <input type="range" id="volSlider" min="0" max="100" step="5" />
        </div>
        <div class="opt-row">
          <span class="lbl" data-i18n="levelupStyle">昇格演出</span>
          <select id="levelupSel"></select>
        </div>
        <div class="opt-row">
          <span class="lbl" data-i18n="theme">テーマ</span>
          <select id="themeSel"></select>
        </div>
        <div class="opt-row">
          <span class="lbl" data-i18n="accentLabel">アクセント</span>
          <div class="accent-row" id="accentRow">
            <button class="sw" data-accent="teal" style="background: #4ecdc4"></button>
            <button class="sw" data-accent="blue" style="background: #5b8fe0"></button>
            <button class="sw" data-accent="green" style="background: #5cc28d"></button>
            <button class="sw" data-accent="purple" style="background: #9b8cf0"></button>
          </div>
        </div>

        <div class="pro-box" id="proBox">
          <span class="pro-status" id="proStatus"></span>
          <button class="btn-pro" id="getProBtn" data-i18n="proGet">Proを入手</button>
        </div>

        <div class="backup-row">
          <button class="btn-backup" id="exportBtn" data-i18n="exportBtn">
            バックアップ書き出し
          </button>
          <button class="btn-backup" id="importBtn" data-i18n="importBtn">
            バックアップ読み込み
          </button>
          <input type="file" id="importFile" accept="application/json" style="display: none" />
        </div>

        <div class="panel-actions">
          <button class="btn-reset-dist" id="resetDistBtn" data-i18n="resetDefault">
            既定に戻す
          </button>
          <button class="btn-close" id="closeSettingsBtn" data-i18n="close">閉じる</button>
        </div>
        <div class="help-link">
          <a id="helpLink" data-i18n="help">使い方</a>
          <span style="color: var(--text-faint)"> · </span>
          <a id="privacyLink" href="privacy.html" target="_blank" rel="noopener" data-i18n="privacy"
            >プライバシーポリシー</a
          >
        </div>
      </div>
    </div>

    <div class="settings" id="onboardOverlay">
      <div class="panel ob-panel">
        <div class="ob-ico" id="obIco">🍅</div>
        <div class="ob-title" id="obTitle"></div>
        <div class="ob-body" id="obBody"></div>
        <div class="ob-dots" id="obDots"></div>
        <div class="ob-actions">
          <button class="ob-skip" id="obSkipBtn" data-i18n="obSkip">スキップ</button>
          <button class="ob-next" id="obNextBtn"></button>
        </div>
      </div>
    </div>

    <div class="settings" id="logOverlay">
      <div class="panel">
        <h2 data-i18n="logTitle">学習ログ</h2>
        <div class="hint" data-i18n="subjectsLabel" style="margin-top: 6px">科目</div>
        <div class="save-row">
          <input id="subjectName" type="text" maxlength="20" data-i18n-ph="subjectPh" />
          <button class="btn-save-custom" id="addSubjectBtn">＋</button>
        </div>
        <div class="custom-list" id="subjectList"></div>
        <div class="hint" data-i18n="historyLabel" style="margin-top: 18px">履歴</div>
        <div class="log-list" id="logList"></div>
        <div class="panel-actions">
          <button class="btn-close" id="closeLogBtn" data-i18n="close">閉じる</button>
        </div>
      </div>
    </div>

    <div class="settings" id="rankupOverlay">
      <div class="sparkles" aria-hidden="true">
        <span style="--tx: -120px; --ty: -70px; background: #ffe08a"></span>
        <span style="--tx: 120px; --ty: -70px; background: var(--accent)"></span>
        <span style="--tx: -150px; --ty: 20px; background: var(--accent2)"></span>
        <span style="--tx: 150px; --ty: 20px; background: #ffe08a"></span>
        <span style="--tx: -80px; --ty: -130px; background: var(--accent2)"></span>
        <span style="--tx: 80px; --ty: -130px; background: var(--accent)"></span>
        <span style="--tx: -40px; --ty: 120px; background: #ffe08a"></span>
        <span style="--tx: 40px; --ty: 120px; background: var(--accent2)"></span>
      </div>
      <div class="confetti" aria-hidden="true">
        <span style="left: 12%; background: var(--accent); animation-delay: 0s"></span>
        <span style="left: 22%; background: #ffe08a; animation-delay: 0.15s"></span>
        <span style="left: 33%; background: var(--accent2); animation-delay: 0.05s"></span>
        <span style="left: 44%; background: var(--accent); animation-delay: 0.25s"></span>
        <span style="left: 55%; background: #ffe08a; animation-delay: 0.1s"></span>
        <span style="left: 66%; background: var(--accent2); animation-delay: 0.3s"></span>
        <span style="left: 77%; background: var(--accent); animation-delay: 0.18s"></span>
        <span style="left: 88%; background: #ffe08a; animation-delay: 0.08s"></span>
        <span style="left: 28%; background: var(--accent2); animation-delay: 0.35s"></span>
        <span style="left: 60%; background: var(--accent); animation-delay: 0.42s"></span>
      </div>
      <div class="panel rankup-panel">
        <div class="rankup-ico" id="rankupIco">🥉</div>
        <div class="rankup-title" data-i18n="rankUp">ランクアップ！</div>
        <div class="rankup-name" id="rankupName">Bronze</div>
        <label class="rankup-dont"
          ><input type="checkbox" id="rankupDont" />
          <span data-i18n="dontShowAgain">今後この画面を表示しない</span></label
        >
        <button class="btn-close" id="rankupCloseBtn" data-i18n="close">閉じる</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
