<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cramodoro — 集中学習タイマー</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cramodoro">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ===== テーマ（配色をCSS変数化）===== */
  :root {
    --bg: #0b2545; --bg-focus: #1a1a2e; --panel: #13132a;
    --surface1: #1c1c34; --surface2: #23233f; --surface3: #2a2a4a;
    --surface-hover: #2f2f54; --chip-del: #3a3a5e; --border: #2a2a4a;
    --text: #eee; --text-strong: #fff; --text-dim: #aab; --text-faint: #777;
    --accent: #4ecdc4; --accent2: #6aa9e0; --on-accent: #0b2545; --gold: #f5a623;
  }
  body.light {
    --bg: #eef1f7; --bg-focus: #e6e9f2; --panel: #ffffff;
    --surface1: #f0f2f7; --surface2: #e7eaf2; --surface3: #dfe3ec;
    --surface-hover: #d2d7e4; --chip-del: #cdd3e1; --border: #d7dbe6;
    --text: #1c2233; --text-strong: #0d1220; --text-dim: #5a6478; --text-faint: #99a0b0;
    --on-accent: #0b2545;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.6s ease, color 0.3s ease;
  }

  /* 集中タイマーが動いている時だけ色を変える */
  body.focusing {
    background: var(--bg-focus);
  }

  .container {
    text-align: center;
    width: 340px;
  }

  .mode-label {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 32px;
    height: 16px;
    transition: color 0.4s;
  }

  .mode-label.break { color: var(--accent2); }

  .ring-wrapper {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto 36px;
  }

  svg.ring {
    transform: rotate(-90deg);
    width: 260px;
    height: 260px;
  }

  circle.track {
    fill: none;
    stroke: var(--surface3);
    stroke-width: 8;
  }

  circle.progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 722;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.4s;
  }

  circle.progress.break { stroke: var(--accent2); }

  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .time {
    font-size: 64px;
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1;
  }

  .sessions {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 1px;
  }

  .controls {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 50px;
    font-size: 14px;
    letter-spacing: 1px;
    transition: transform 0.1s, opacity 0.2s;
  }

  button:active { transform: scale(0.96); }

  .btn-main {
    background: var(--accent);
    color: var(--text-strong);
    padding: 14px 48px;
    font-size: 15px;
    font-weight: 600;
  }

  .btn-main.break { background: var(--accent2); }

  .btn-icon {
    background: var(--surface3);
    color: var(--text-dim);
    width: 44px;
    height: 44px;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }

  .btn-icon:hover { color: var(--text); }

  .count {
    margin-top: 28px;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--text-faint);
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
  }

  .count:hover { color: var(--text-dim); }

  .count b {
    color: var(--accent);
    font-weight: 600;
    font-size: 16px;
  }

  /* ===== 設定（確率分布エディタ） ===== */
  .gear {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--surface3);
    color: var(--text-dim);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gear:hover { color: var(--text); }

  .settings {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 16px;
  }
  .settings.open { display: flex; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--surface3);
    border-radius: 16px;
    padding: 22px 22px 18px;
    width: 360px;
    max-width: 100%;
  }

  .panel h2 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 4px;
    color: var(--text);
  }

  .panel .hint {
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .panel .mean {
    font-size: 13px;
    color: var(--accent2);
    margin-bottom: 10px;
    min-height: 18px;
  }

  .bars {
    position: relative;
    height: 150px;
    display: flex;
    gap: 3px;
    touch-action: none;
    user-select: none;
    padding-top: 6px;
  }

  .bar {
    flex: 1;
    position: relative;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
    cursor: ns-resize;
  }

  .bar .fill {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--accent);
    transition: height 0.05s linear;
  }

  .bar-labels {
    display: flex;
    gap: 3px;
    margin-top: 6px;
  }
  .bar-labels span {
    flex: 1;
    text-align: center;
    font-size: 9px;
    color: var(--text-faint);
  }

  .panel-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }
  .panel-actions button {
    padding: 10px 20px;
    font-size: 13px;
  }
  .btn-reset-dist { background: var(--surface3); color: var(--text-dim); }
  .btn-close { background: var(--accent); color: var(--text-strong); font-weight: 600; }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 14px;
  }
  .presets-label {
    font-size: 11px;
    color: var(--text-faint);
    width: 100%;
    margin-bottom: 2px;
  }
  .presets button {
    background: var(--surface2);
    color: var(--text-dim);
    padding: 7px 12px;
    font-size: 12px;
    border-radius: 8px;
  }
  .presets button:hover { color: var(--text-strong); background: var(--surface-hover); }
  .presets button.custom { color: var(--accent2); }
  .presets button.custom:disabled {
    color: var(--text-faint);
    background: var(--surface1);
    cursor: default;
  }

  .save-row {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  .save-row input {
    flex: 1;
    background: var(--surface1);
    border: 1px solid var(--surface3);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
  }
  .save-row input::placeholder { color: var(--text-faint); }
  .save-row input:focus { border-color: var(--accent2); }
  .save-row .btn-save-custom {
    background: var(--accent2);
    color: #0b2545;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 16px;
    white-space: nowrap;
  }

  .custom-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    min-height: 4px;
  }
  .custom-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border-radius: 20px;
    padding: 5px 6px 5px 12px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .custom-chip .name { cursor: pointer; }
  .custom-chip .name:hover { color: var(--text-strong); }
  .custom-chip .del {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--chip-del);
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .custom-chip .del:hover { background: var(--accent); color: var(--text-strong); }
  .custom-empty {
    font-size: 11px;
    color: var(--text-faint);
  }

  /* 休憩中だけ出る静的バナー枠。Proで非表示。
     ★方針: 動画広告は差し込まない（インタースティシャル/全画面/リワード動画は使用しない）。
       Phase 2 でも AdMob は「バナー（静的）」ユニットのみ。 */
  .ad-slot {
    display: none;
    margin: 24px auto 0;
    width: 300px;
    max-width: 100%;
    height: 70px;
    border: 1px dashed var(--surface3);
    border-radius: 10px;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    font-size: 12px;
    letter-spacing: 1px;
    position: relative;
  }
  .ad-slot .ad-tag {
    position: absolute;
    top: 4px;
    left: 8px;
    font-size: 9px;
    color: var(--text-faint);
  }

  /* Pro / アップグレード枠 */
  .pro-box {
    margin-top: 18px;
    padding: 12px 14px;
    border: 1px solid var(--surface3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .pro-box.active { border-color: var(--accent2); }
  .pro-box.flash { border-color: var(--accent); }
  .pro-status { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
  .pro-box.active .pro-status { color: var(--accent2); }
  .pro-box.flash .pro-status { color: var(--accent); }
  .btn-pro {
    background: var(--gold);
    color: #2a1a00;
    font-weight: 600;
    font-size: 12px;
    padding: 9px 14px;
    white-space: nowrap;
  }

  /* 統計ボタン（歯車の左） */
  .stats-btn {
    position: fixed;
    top: 16px;
    right: 66px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--surface3);
    color: var(--text-dim);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stats-btn:hover { color: var(--text); }

  /* ランク表示 */
  .rank-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    margin-bottom: 8px;
  }
  .rank-row .rank-ico { font-size: 26px; }
  .rank-row .rank-name { font-weight: 600; color: var(--text); }
  .rank-row .rank-label { font-size: 11px; color: var(--text-faint); margin-left: auto; }

  .rank-bar {
    height: 8px;
    background: var(--surface2);
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .rank-bar .fill { height: 100%; background: var(--gold); width: 0; transition: width 0.3s; }
  .rank-next { font-size: 11px; color: var(--text-faint); margin-bottom: 16px; text-align: right; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-tile {
    background: var(--surface1);
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat-tile .v { font-size: 20px; font-weight: 600; color: var(--text); }
  .stat-tile .l { font-size: 10px; color: var(--text-faint); margin-top: 2px; }

  .standing {
    background: var(--surface1);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--accent2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .standing b { font-size: 16px; }

  .hist-label { font-size: 11px; color: var(--text-faint); margin-bottom: 6px; }
  .hist {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 90px;
  }
  .hist .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .hist .col .b {
    width: 100%;
    background: var(--accent2);
    border-radius: 3px 3px 0 0;
    min-height: 2px;
  }
  .hist .col.today .b { background: var(--accent); }
  .hist .col .d { font-size: 8px; color: var(--text-faint); margin-top: 3px; }

  .range-row { display: flex; gap: 4px; margin-bottom: 8px; }
  .range-row button { flex: 1; background: var(--surface2); color: var(--text-dim); font-size: 11px; padding: 6px 0; border-radius: 6px; }
  .range-row button:hover { color: var(--text-strong); }
  .range-row button.active { background: var(--accent2); color: #0b2545; font-weight: 600; }

  /* 学習ログ ボタン（統計の左） */
  .log-btn {
    position: fixed;
    top: 16px;
    right: 116px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--surface3);
    color: var(--text-dim);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .log-btn:hover { color: var(--text); }

  .log-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .log-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface1);
    border-radius: 8px;
    padding: 7px 10px;
  }
  .log-row .log-meta { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .log-row select {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--surface3);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 12px;
    padding: 5px 6px;
    max-width: 150px;
    outline: none;
  }

  /* 休憩設定 */
  .break-settings {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 10px;
    align-items: center;
    margin-top: 16px;
  }
  .break-settings label { font-size: 12px; color: var(--text-dim); }
  .break-settings input {
    width: 64px;
    background: var(--surface1);
    border: 1px solid var(--surface3);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 8px;
    text-align: center;
    outline: none;
  }
  .break-settings input:focus { border-color: var(--accent2); }

  /* バックアップ */
  .backup-row { display: flex; gap: 8px; margin-top: 16px; }
  .btn-backup { flex: 1; background: var(--surface2); color: var(--text-dim); font-size: 12px; padding: 9px 8px; border-radius: 8px; }
  .btn-backup:hover { background: var(--surface-hover); color: var(--text-strong); }

  /* メイン画面のランク章 */
  .rank-badge { margin-top: 10px; font-size: 13px; color: var(--text-dim); letter-spacing: 0.5px; }
  .rank-badge .ico { font-size: 16px; vertical-align: -2px; }

  /* ランクアップ ポップアップ */
  .rankup-panel { width: 300px; max-width: 100%; text-align: center; padding: 28px 24px 22px; }
  .rankup-ico { font-size: 64px; line-height: 1; }
  .rankup-title { font-size: 18px; font-weight: 600; color: var(--gold); margin-top: 10px; letter-spacing: 1px; }
  .rankup-name { font-size: 22px; font-weight: 600; color: var(--text); margin: 4px 0 20px; }
  .rankup-dont { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 12px; color: var(--text-faint); margin-bottom: 18px; cursor: pointer; }
  .rankup-dont input { width: 15px; height: 15px; accent-color: var(--accent2); }
  .rankup-panel .btn-close { width: 100%; }

  /* パネルを長くなってもスクロール可能に */
  .settings .panel { max-height: 88vh; overflow-y: auto; }

  /* 設定の汎用行（目標・音・演出） */
  .opt-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--text-dim); }
  .opt-row > span.lbl { flex-shrink: 0; min-width: 72px; }
  .opt-row select, .opt-row input[type=number] { background: var(--surface1); border: 1px solid var(--surface3); border-radius: 8px; color: var(--text); font-size: 13px; padding: 7px 8px; outline: none; }
  .opt-row input[type=number] { width: 60px; text-align: center; }
  .opt-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .opt-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }

  /* メイン：今日の目標 */
  .goal { margin: 10px auto 0; width: 210px; max-width: 80%; }
  .goal .goal-text { font-size: 12px; color: var(--text-dim); text-align: center; }
  .goal .goal-text.done { color: var(--accent); }
  .goal .goal-bar { height: 6px; background: var(--surface2); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .goal .goal-fill { height: 100%; background: var(--accent2); width: 0; transition: width 0.3s; }
  .goal .goal-fill.done { background: var(--accent); }

  /* メイン：休憩中の次回予告＋tips */
  .break-info { margin-top: 14px; min-height: 1px; }
  .break-info .next { font-size: 13px; color: var(--accent2); }
  .break-info .tip { font-size: 12px; color: var(--text-faint); margin-top: 3px; }

  /* 昇格演出 */
  @keyframes lvPop { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes lvBounce { 0% { transform: scale(.4); } 50% { transform: scale(1.25); } 72% { transform: scale(.92); } 100% { transform: scale(1); } }
  #rankupOverlay.open .rankup-panel { animation: lvPop .45s cubic-bezier(.2,.8,.3,1.2) both; }
  #rankupOverlay.open .rankup-ico { display: inline-block; animation: lvBounce .7s .08s both; }

  .sparkles, .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; display: none; }
  #rankupOverlay.fx-sparkle .sparkles { display: block; }
  #rankupOverlay.fx-confetti .confetti { display: block; }
  .sparkles span { position: absolute; left: 50%; top: 44%; width: 11px; height: 11px; border-radius: 2px; opacity: 0; }
  #rankupOverlay.open.fx-sparkle .sparkles span { animation: spark .85s ease-out both; }
  @keyframes spark { 0% { transform: translate(-50%,-50%) scale(.2); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; } }
  .confetti span { position: absolute; top: -16px; width: 8px; height: 14px; border-radius: 2px; opacity: 0; }
  #rankupOverlay.open.fx-confetti .confetti span { animation: conf 1.5s linear both; }
  @keyframes conf { 0% { transform: translateY(-20px) rotate(0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(420px) rotate(560deg); opacity: .15; } }

  /* オンボーディング */
  .ob-panel { width: 320px; max-width: 100%; text-align: center; padding: 30px 24px 22px; }
  .ob-ico { font-size: 50px; line-height: 1; }
  .ob-title { font-size: 18px; font-weight: 600; color: var(--text); margin: 12px 0 8px; }
  .ob-body { font-size: 13px; color: var(--text-dim); line-height: 1.7; min-height: 52px; }
  .ob-dots { display: flex; gap: 7px; justify-content: center; margin: 18px 0; }
  .ob-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface3); }
  .ob-dots i.on { background: var(--accent); }
  .ob-actions { display: flex; gap: 10px; }
  .ob-actions button { flex: 1; padding: 11px; font-size: 13px; }
  .ob-skip { background: var(--surface3); color: var(--text-dim); }
  .ob-next { background: var(--accent); color: var(--on-accent); font-weight: 600; }

  /* アクセント色スウォッチ */
  .accent-row { display: flex; gap: 10px; align-items: center; }
  .accent-row .sw { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; padding: 0; }
  .accent-row .sw.on { border-color: var(--text); }

  /* アクセシビリティ */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar:focus-visible { outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* レベルアップ トースト */
  .level-toast {
    position: fixed; top: 70px; left: 50%;
    background: var(--surface2); color: var(--accent);
    border: 1px solid var(--accent);
    padding: 8px 18px; border-radius: 20px;
    font-size: 14px; font-weight: 600; letter-spacing: 1px;
    opacity: 0; pointer-events: none; z-index: 30;
  }
  .level-toast.show { animation: lvtoast 1.8s ease both; }
  @keyframes lvtoast {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    80% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -8px); }
  }

  /* 使い方リンク */
  .help-link { text-align: center; margin-top: 14px; }
  .help-link a { color: var(--text-faint); font-size: 11px; cursor: pointer; text-decoration: underline; }
  .help-link a:hover { color: var(--accent); }

  /* 言語切替 */
  .lang {
    position: fixed;
    top: 16px;
    left: 16px;
    background: var(--surface3);
    color: var(--text-dim);
    border: none;
    border-radius: 50px;
    font-size: 13px;
    padding: 9px 14px;
    cursor: pointer;
    outline: none;
  }
  .lang:hover { color: var(--text-strong); }

  // 休憩の設定（編集可）。短い休憩・長い休憩・長休憩の間隔（◯回ごと）。
  const DEFAULT_BREAK = { short: 5, long: 15, every: 4 };
  function loadBreak() {
    try { const s = JSON.parse(localStorage.getItem('pomo_break')); if (s && s.short && s.long && s.every) return { short: +s.short, long: +s.long, every: +s.every }; } catch (e) {}
    return { ...DEFAULT_BREAK };
  }
  let brk = loadBreak();
  function saveBreak() { localStorage.setItem('pomo_break', JSON.stringify(brk)); }
  let focusInRun = 0;   // この稼働で完了した集中数（長休憩の判定用）
  let nextFocusSec = 0; // 休憩中に予告する「次の集中」（休憩開始時に確定）

  // デイリー目標（単位はユーザーが選択：回数 count / 時間 min）
  function loadGoal() { try { const s = JSON.parse(localStorage.getItem('pomo_goal')); if (s && (s.unit === 'count' || s.unit === 'min') && s.value > 0) return { unit: s.unit, value: +s.value }; } catch (e) {} return { unit: 'count', value: 8 }; }
  let dailyGoal = loadGoal();
  function saveGoal() { localStorage.setItem('pomo_goal', JSON.stringify(dailyGoal)); }

  // 音（オン/オフ＋音量0-100）
  let soundOn  = localStorage.getItem('pomo_sound') !== '0';
  let soundVol = (() => { const v = parseInt(localStorage.getItem('pomo_vol'), 10); return isNaN(v) ? 60 : Math.max(0, Math.min(100, v)); })();

  // 昇格演出スタイル（sparkle / subtle / confetti）
  let levelupStyle = localStorage.getItem('pomo_lvfx') || 'sparkle';

  const ACCENTS = { teal: ['#4ecdc4', '#6aa9e0'], blue: ['#5b8fe0', '#4ecdc4'], green: ['#5cc28d', '#6aa9e0'], purple: ['#9b8cf0', '#5fb6df'] };
  function applyTheme() {
    document.body.classList.toggle('light', theme === 'light');
    const a = ACCENTS[accent] || ACCENTS.teal;
    document.documentElement.style.setProperty('--accent', a[0]);
    document.documentElement.style.setProperty('--accent2', a[1]);
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.content = (theme === 'light') ? '#eef1f7' : '#0b2545';

  function loadLang() {

  let lang = loadLang();

  function t(key, arg) {
    const dict = I18N[lang] || I18N.en;
    let v = dict[key];
    if (v === undefined) v = I18N.en[key];
    return typeof v === 'function' ? v(arg) : v;

  // 集中時間の確率分布（ユーザーが設定でいじれる）。
  // 1〜60分を5分刻み12バケツに分割し、各バケツの「重み」(0〜100)で出やすさを決める。
  // バケツ b（0〜11）の範囲は [b*5+1, b*5+5] 分。例: b=0→1〜5分, b=4→21〜25分, b=11→56〜60分。
  const BUCKETS = 12;
  // 既定: 20〜25分付近をピークにした山型（従来の三角分布に近い）。
  const DEFAULT_WEIGHTS = [8, 15, 30, 60, 80, 55, 35, 22, 14, 9, 6, 4];

  function loadWeights() {
    try {
      const s = JSON.parse(localStorage.getItem('pomo_dist'));
      if (Array.isArray(s) && s.length === BUCKETS) {
        return s.map(n => Math.max(0, Math.min(100, Number(n) || 0)));
      }
    } catch (e) {}
    return DEFAULT_WEIGHTS.slice();
  }

  let weights = loadWeights();

  function saveWeights() {
    localStorage.setItem('pomo_dist', JSON.stringify(weights));
  }

  // 重みに比例してバケツを選び、その中で分を一様乱数で決める。
  function sampleWorkSec() {
    const total = weights.reduce((a, b) => a + b, 0);
    let b;
    if (total <= 0) {
      b = Math.floor(Math.random() * BUCKETS);   // 全部0なら均等
    } else {
      let r = Math.random() * total;
      for (b = 0; b < BUCKETS; b++) {
        r -= weights[b];
        if (r < 0) break;
      }
      if (b >= BUCKETS) b = BUCKETS - 1;
    }
    const lo = b * 5 + 1, hi = b * 5 + 5;
    const minutes = lo + Math.floor(Math.random() * (hi - lo + 1));
    return minutes * 60;
  }

  let totalSec   = sampleWorkSec();
  let remaining  = totalSec;
  let isRunning  = false;
  let isBreak    = false;
  let sessionNum = 1;
  let interval   = null;

  const skipBtn        = document.getElementById('skipBtn');

  let completedCount = parseInt(localStorage.getItem('pomo_completed') || '0', 10) || 0;

  // 累計の集中「時間」（秒）。ランクはこれで決まる。
  let totalFocusSec = parseInt(localStorage.getItem('pomo_focus_sec') || '0', 10) || 0;
  function totalFocusMin() { return Math.floor(totalFocusSec / 60); }

  // レベルのXP（時間＋ボーナス）。未保存の既存ユーザーは現在の集中時間から引き継ぐ。
  let totalXP = (() => { const v = localStorage.getItem('pomo_xp'); return v !== null ? (parseInt(v, 10) || 0) : totalFocusMin(); })();
  function saveXP() { localStorage.setItem('pomo_xp', String(totalXP)); }

  // 学習ログ：完了した集中セッションの記録。{ end:ms, min:分, label:科目 }
  function loadLog() { try { const s = JSON.parse(localStorage.getItem('pomo_log')); if (Array.isArray(s)) return s; } catch (e) {} return []; }
  let logEntries = loadLog();
  function saveLog() { localStorage.setItem('pomo_log', JSON.stringify(logEntries)); }

  // 登録した科目（ログのラベル候補）。

  function saveSubjects() { localStorage.setItem('pomo_subjects', JSON.stringify(subjects)); }

  // 日次の完了回数（推移グラフ・連続日数用）。{ "YYYY-MM-DD": 回数 }
  function todayStr(dt) {
    dt = dt || new Date();
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  }
  function loadDaily() {
    try { const s = JSON.parse(localStorage.getItem('pomo_daily')); if (s && typeof s === 'object') return s; } catch (e) {}
    return {};
  }
  let daily = loadDaily();
  function saveDaily() { localStorage.setItem('pomo_daily', JSON.stringify(daily)); }
  function currentStreak() {
    let s = 0;
    for (let i = 0; ; i++) { const d = new Date(); d.setDate(d.getDate() - i); if ((daily[todayStr(d)] || 0) > 0) s++; else break; }
    return s;
  }

  function updateCount() {
    countDisplay.textContent = t('completed', completedCount);
  }

  function addCompletion() {
    const focusSec = totalSec;                          // いま完了した集中の長さ
    const focusMin = Math.round(focusSec / 60);
    const k = todayStr();
    const todayCountBefore = daily[k] || 0;
    const before = rankIndexFor(totalFocusMin());       // ランクは「時間」基準
    const beforeLv = levelInfo(totalXP).level;          // レベルは「XP」基準

    completedCount++;
    localStorage.setItem('pomo_completed', String(completedCount));
    totalFocusSec += focusSec;
    localStorage.setItem('pomo_focus_sec', String(totalFocusSec));
    daily[k] = todayCountBefore + 1;
    saveDaily();
    // 学習ログに追記（科目は後から入れられる）
    logEntries.push({ end: Date.now(), min: focusMin, label: '' });
    if (logEntries.length > 1000) logEntries = logEntries.slice(-1000);
    saveLog();

    // ===== XP（時間＋ボーナス）=====
    let xp = focusMin;
    if (focusMin > 30) xp += Math.round((focusMin - 30) * 0.5);   // 長時間集中ボーナス
    if (todayCountBefore === 0) xp += Math.min(30, currentStreak() * 2);  // 連続日数ボーナス（その日最初）
    // 目標達成ボーナス（今日の目標に“今”到達したら）
    let goalBefore, goalAfter;
    if (dailyGoal.unit === 'min') {
      let after = 0; logEntries.forEach(e => { if (todayStr(new Date(e.end)) === k) after += e.min; });
      goalAfter = after; goalBefore = after - focusMin;
    } else {
      goalAfter = daily[k]; goalBefore = goalAfter - 1;
    }
    if (goalBefore < dailyGoal.value && goalAfter >= dailyGoal.value) xp += 15;
    totalXP += xp;
    saveXP();

    updateCount();
    renderRankBadge();
    renderGoal();
    const afterLv = levelInfo(totalXP).level;
    if (afterLv > beforeLv) showLevelToast(afterLv);    // レベルアップは小さなトースト
    const after = rankIndexFor(totalFocusMin());
    if (after > before) showRankUp(after, false);       // ランク昇格はポップアップ
  }

  function fmt(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateRing() {
    const ratio = remaining / totalSec;
    const offset = CIRCUMFERENCE * (1 - ratio);
    progressRing.style.strokeDashoffset = offset;
    progressRing.style.strokeDasharray  = CIRCUMFERENCE;
  }

  function updateBackground() {
    // 集中モードで動作中のときだけ画面の色を変える
    document.body.classList.toggle('focusing', isRunning && !isBreak);
  }

  function updateUI() {
    timeDisplay.textContent = fmt(remaining);
    updateRing();
    updateBackground();

    const isWork = !isBreak;
    modeLabel.textContent = isWork ? t('focusLabel', Math.round(totalSec / 60)) : t('break');
    modeLabel.className   = 'mode-label' + (isBreak ? ' break' : '');
    progressRing.setAttribute('class', 'progress' + (isBreak ? ' break' : ''));  // SVGはsetAttributeでないとclassが付かない
    startBtn.className    = 'btn-main' + (isBreak ? ' break' : '');
    startBtn.textContent  = t(isRunning ? 'stop' : 'start');
    sessionsDisplay.textContent = t('session', sessionNum);
    document.title = `${fmt(remaining)} — ${isWork ? t('focus') : t('break')}`;
    // 広告は「休憩中だけ」表示（Proなら常に非表示）
    adSlot.style.display = (MONETIZATION_ON && isBreak && !isPro()) ? 'flex' : 'none';
    // 休憩中だけ：次回予告＋tip
    if (isBreak) {
      const tips = (I18N[lang] && I18N[lang].tips) || I18N.en.tips;
      const tip = tips[sessionNum % tips.length];
      breakInfo.innerHTML = `<div class="next">${t('nextUp')} ${t('focusLabel', Math.round((nextFocusSec || 0) / 60))}</div><div class="tip">${tip}</div>`;
    } else {
      breakInfo.innerHTML = '';
    }
  }

  function beep(type) {
    if (!soundOn || soundVol <= 0) return;        // ミュート・音量0なら鳴らさない
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = type === 'end'
      ? [{ f: 880, t: 0, d: 0.25 }, { f: 1100, t: 0.28, d: 0.35 }]
      : [{ f: 660, t: 0, d: 0.2 }];

    notes.forEach(({ f, t, d }) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = f;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.4 * (soundVol / 100), ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + d);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + d + 0.05);
    });
  }

  function switchMode() {
    if (!isBreak) {
      // 集中 → 休憩（every 回ごとに長い休憩）
      isBreak   = true;
      const isLong = (focusInRun > 0 && focusInRun % brk.every === 0);
      totalSec  = (isLong ? brk.long : brk.short) * 60;
      remaining = totalSec;
      nextFocusSec = sampleWorkSec();   // 休憩中に予告するため次の集中を先に確定
    } else {
      // 休憩 → 集中（休憩開始時に予告した時間を使う）
      isBreak   = false;
      sessionNum++;
      totalSec  = nextFocusSec || sampleWorkSec();
      remaining = totalSec;
    }
    updateUI();
  }

  // ===== スマホ/PC通知 =====
  function requestNotifyPermission() {
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
  }
  function showNotify(title, body) {
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready
          .then(reg => reg.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'cramodoro-phase', renotify: true }))
          .catch(() => { try { new Notification(title, { body }); } catch (e) {} });
      } else {
        new Notification(title, { body });
      }
    } catch (e) {}
  }
  function notifyPhase() {
    const body = isBreak ? t('break') : t('focusLabel', Math.round(totalSec / 60));
    showNotify('Cramodoro', body);
  }

  // タイムスタンプ方式：実時刻(endTime)から残りを計算。背面で複数フェーズ跨いでも“追いつく”。
  function tick() {
    if (!isRunning) return;
    let ended = false, guard = 0;
    while (Date.now() >= endTime && guard < 1000) {
      guard++;
      if (!isBreak) { addCompletion(); focusInRun++; }  // 集中を完走した時だけカウント
      switchMode();                    // 次フェーズをセット（totalSec/remaining/isBreak更新）
      endTime += totalSec * 1000;      // 次フェーズ終了＝前の終了＋今回の長さ
      ended = true;
    }
    remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    if (ended) { beep('end'); notifyPhase(); }   // 通知は復帰時にまとめて1回
    updateUI();
  }

  function start() {
    // メインボタンはスタート / ストップのトグル。
    // 一度スタートしたら、ストップを押すまで集中と休憩を自動で繰り返す。
    if (isRunning) {
      clearInterval(interval);
      isRunning = false;
      remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));  // 現在値で固定
      startBtn.textContent = t('start');
    } else {
      requestNotifyPermission();
      beep('start');
      isRunning = true;
      endTime = Date.now() + remaining * 1000;   // 終了を絶対時刻で保持
      startBtn.textContent = t('stop');
      interval = setInterval(tick, 1000);
    }
    updateBackground();
  }

  function reset() {
    clearInterval(interval);
    isRunning  = false;
    isBreak    = false;

  // 12バケツ(1-5,6-10,…,56-60分)の重みプリセット。それぞれ指定の分あたりが山型のピーク。
  const PRESETS = {
    p15: [40, 70, 90, 62, 38, 22, 12,  7,  4,  2,  1,  1],  // 15分あたり多め
    p25: [ 6, 14, 30, 60, 85, 60, 35, 20, 12,  7,  4,  2],  // 25分あたり多め
    p45: [ 2,  3,  5,  8, 14, 24, 40, 65, 88, 65, 40, 22],  // 45分あたり多め
    p60: [ 1,  1,  2,  3,  5,  8, 14, 24, 40, 60, 85,100],  // 60分あたり多め
  };

  function applyWeights(arr) {
    weights = arr.slice();
    saveWeights();
    refreshBars();
    updateMean();
  }

  function buildBars() {
    barsEl.innerHTML = '';
    barLabels.innerHTML = '';
    for (let i = 0; i < BUCKETS; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      // アクセシビリティ：キーボード操作できるスライダーに
      bar.setAttribute('role', 'slider');
      bar.setAttribute('tabindex', '0');
      bar.setAttribute('aria-label', `${i * 5 + 1}-${i * 5 + 5} min`);
      bar.setAttribute('aria-valuemin', '0');
      bar.setAttribute('aria-valuemax', '100');
      bar.setAttribute('aria-valuenow', String(weights[i]));
      bar.addEventListener('keydown', (e) => {
        let d = 0;
        if (e.key === 'ArrowUp' || e.key === 'ArrowRight') d = 5;
        else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') d = -5;
        else return;
        e.preventDefault();
        weights[i] = Math.max(0, Math.min(100, weights[i] + d));
        refreshBars(); updateMean(); saveWeights();
      });
      const fill = document.createElement('div');
      fill.className = 'fill';
      fill.style.height = weights[i] + '%';
      bar.appendChild(fill);
      barsEl.appendChild(bar);

      const label = document.createElement('span');
      label.textContent = (i * 5 + 5);   // バケツ上限: 5,10,…,60
      barLabels.appendChild(label);
    }
  }

  function refreshBars() {
    [...barsEl.children].forEach((bar, i) => {
      bar.firstChild.style.height = weights[i] + '%';
      bar.setAttribute('aria-valuenow', String(weights[i]));
    });
  }

  function updateMean() {
    const total = weights.reduce((a, b) => a + b, 0);
    if (total <= 0) {
      distMean.textContent = t('meanZero');
      return;
    }
    let mean = 0;
    for (let i = 0; i < BUCKETS; i++) mean += weights[i] * (i * 5 + 3); // バケツ中央
    mean /= total;
    distMean.textContent = t('mean', Math.round(mean));
  }

  let dragging = false;
  let dragIndex = -1;   // ドラッグ開始時に触れたバーに固定
  function indexAt(clientX) {
    const rect = barsEl.getBoundingClientRect();
    const idx = Math.floor((clientX - rect.left) / (rect.width / BUCKETS));
    return Math.max(0, Math.min(BUCKETS - 1, idx));
  }
  function applyAt(clientY) {
    if (dragIndex < 0) return;
    const rect = barsEl.getBoundingClientRect();
    let w = Math.round((1 - (clientY - rect.top) / rect.height) * 100);
    w = Math.max(0, Math.min(100, w));
    weights[dragIndex] = w;   // 最初に触れたバーだけを編集（横ズレで乗り移らない）
    refreshBars();
    updateMean();
  }

  barsEl.addEventListener('pointerdown', (e) => {
    dragging = true;
    dragIndex = indexAt(e.clientX);   // 押した位置のバーに固定
    barsEl.setPointerCapture(e.pointerId);
    applyAt(e.clientY);
  });
  barsEl.addEventListener('pointermove', (e) => {
    if (dragging) applyAt(e.clientY);   // 縦移動だけ反映
  });
  function endDrag() {

  function loadCustoms() {
    try {
      const s = JSON.parse(localStorage.getItem('pomo_customs'));
      if (Array.isArray(s)) {
        return s.filter(e => e && Array.isArray(e.weights) && e.weights.length === BUCKETS)
                .map(e => ({ name: String(e.name || ''), weights: e.weights.map(Number) }));
      }
    } catch (e) {}
    // 旧・単一スロットからの移行
    try {
      const old = JSON.parse(localStorage.getItem('pomo_dist_custom'));
      if (Array.isArray(old) && old.length === BUCKETS) {
        return [{ name: t('defaultName', 1), weights: old.map(Number) }];
      }
    } catch (e) {}
    return [];
  }

  // 累計の集中「時間（分）」で決まる称号（言語非依存：絵文字＋短い英名）。min は分しきい値。
  const RANKS = [
    { min: 0,     ico: '🌱', name: 'Rookie' },   // 0h
    { min: 300,   ico: '🥉', name: 'Bronze' },   // 5h
    { min: 1200,  ico: '🥈', name: 'Silver' },   // 20h

  function rankIndexFor(totalMin) {
    let idx = 0;

  function fmtHM(min) {
    const h = Math.floor(min / 60), m = Math.round(min % 60);

  }

  // レベル（XP=集中時間・分）。最初は速く、徐々に必要時間が増える。
  function levelInfo(totalMin) {
    let lvl = 1, need = 15, acc = 0;            // Lv1→2 は15分、以降+5分ずつ
    while (totalMin >= acc + need) { acc += need; lvl++; need += 5; }
    return { level: lvl, into: Math.round(totalMin - acc), need: need };
  }

  const levelToast = document.getElementById('levelToast');
  function showLevelToast(lv) {

  const goalDisplay = document.getElementById('goalDisplay');
  function renderGoal() {
    let val, unit;
    const goal = dailyGoal.value;

      `<div class="goal-bar"><div class="goal-fill${done ? ' done' : ''}" style="width:${pct}%"></div></div>`;
  }

  function showRankUp(idx, force) {

  // 1日平均から「推定の上位%」をざっくり算出（一般的な利用者を想定したベンチマーク比・目安）。
  function estTopPct(avgPerDay) {
    const pts = [[0,97],[0.5,88],[1,73],[2,53],[3,35],[4,22],[5,13],[6,8],[8,3],[10,1]];
    if (avgPerDay <= 0) return 97;
    for (let i = 1; i < pts.length; i++) {
      if (avgPerDay <= pts[i][0]) {
        const a = pts[i-1], b = pts[i];
        return Math.round(a[1] + (b[1] - a[1]) * (avgPerDay - a[0]) / (b[0] - a[0]));
      }
    }
    return 1;
  }

  function renderStats() {
    // レベル（こまめに上がる）＋ランク称号
    const cur = RANKS[rankIndexFor(totalFocusMin())];
    const li = levelInfo(totalXP);
    rankIco.textContent = cur.ico;
    rankName.textContent = `Lv.${li.level} · ${cur.name}`;
    rankFill.style.width = Math.max(0, Math.min(100, li.into / li.need * 100)) + '%';
    rankNext.textContent = `Lv.${li.level + 1} ${t('toNext')} ${li.need - li.into} XP`;

    // 連続日数（今日から遡って >0 が続く間）
    let streak = 0;
    for (let i = 0; ; i++) { const d = new Date(); d.setDate(d.getDate() - i); if ((daily[todayStr(d)] || 0) > 0) streak++; else break; }
    // 7日合計・平均
    let week7 = 0;
    for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); week7 += daily[todayStr(d)] || 0; }
    const avgDay = week7 / 7;
    // ベスト/日
    let best = 0;
    for (const k in daily) best = Math.max(best, daily[k]);

    const tiles = [
      { v: daily[todayStr()] || 0, l: t('today') },
      { v: streak,                 l: t('streak') },
      { v: week7,                  l: t('week7') },
      { v: avgDay.toFixed(1),      l: t('avgDay') },
      { v: best,                   l: t('best') },
      { v: fmtHM(totalFocusMin()), l: t('totalTime') },
    ];
    statGrid.innerHTML = tiles.map(s => `<div class="stat-tile"><div class="v">${s.v}</div><div class="l">${s.l}</div></div>`).join('');

    standingVal.textContent = t('topPct', estTopPct(avgDay));

    renderHist();
  }

  // 選択中の期間に応じてバケツ（日/週/月）を作る
  function histBuckets(range) {
    const keys = Object.keys(daily).sort();
    const today = new Date();
    let spanDays;
    if (range === '7d') spanDays = 7;
    else if (range === '14d') spanDays = 14;
    else if (range === '30d') spanDays = 30;
    else if (range === '6m') spanDays = 183;
    else if (range === '1y') spanDays = 365;
    else { // all = いれた日から全期間
      if (keys.length === 0) spanDays = 7;
      else { const first = new Date(keys[0] + 'T00:00:00'); spanDays = Math.max(1, Math.floor((today - first) / 86400000) + 1); }
    }
    const gran = spanDays <= 31 ? 'day' : (spanDays <= 210 ? 'week' : 'month');
    const out = [];
    if (gran === 'day') {
      for (let i = spanDays - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = todayStr(d); out.push({ label: String(d.getDate()), value: daily[k] || 0, isCurrent: i === 0, title: k }); }
    } else if (gran === 'week') {
      const weeks = Math.ceil(spanDays / 7);
      for (let w = weeks - 1; w >= 0; w--) {
        let sum = 0, startD = null;
        for (let j = 0; j < 7; j++) { const d = new Date(); d.setDate(d.getDate() - (w * 7 + j)); sum += daily[todayStr(d)] || 0; if (j === 6) startD = d; }
        out.push({ label: `${startD.getMonth() + 1}/${startD.getDate()}`, value: sum, isCurrent: w === 0, title: `${todayStr(startD)}〜` });
      }
    } else {
      const start = new Date(); start.setDate(start.getDate() - (spanDays - 1));
      let y = start.getFullYear(), m = start.getMonth();
      const ey = today.getFullYear(), em = today.getMonth();
      while (y < ey || (y === ey && m <= em)) {
        const prefix = y + '-' + String(m + 1).padStart(2, '0');
        let sum = 0; for (const k in daily) { if (k.indexOf(prefix) === 0) sum += daily[k]; }
        out.push({ label: String(m + 1), value: sum, isCurrent: (y === ey && m === em), title: prefix });
        m++; if (m > 11) { m = 0; y++; }
      }
    }
    return out;
  }

  function renderHist() {
    [...rangeRow.children].forEach(b => b.classList.toggle('active', b.dataset.range === currentRange));
    const buckets = histBuckets(currentRange);
    const max = Math.max(1, ...buckets.map(b => b.value));
    const n = buckets.length;
    const step = n > 16 ? Math.ceil(n / 8) : 1;   // バーが多い時はラベルを間引く
    histEl.innerHTML = buckets.map((bk, i) => {
      const h = bk.value > 0 ? Math.max(6, bk.value / max * 100) : 2;
      const showLabel = (n <= 16) || bk.isCurrent || (i % step === 0);
      return `<div class="col${bk.isCurrent ? ' today' : ''}"><div class="b" style="height:${h}%" title="${bk.title}: ${bk.value}"></div><div class="d">${showLabel ? bk.label : ''}</div></div>`;
    }).join('');
  }

  [...rangeRow.children].forEach(b => b.addEventListener('click', () => {

    localStorage.setItem('pomo_histRange', currentRange);
    renderHist();
  }));

  closeStatsBtn.addEventListener('click', () => statsOverlay.classList.remove('open'));
  statsOverlay.addEventListener('click', (e) => { if (e.target === statsOverlay) statsOverlay.classList.remove('open'); });

  // ===== 学習ログ（科目登録＋セッション履歴）=====
  const logBtn        = document.getElementById('logBtn');
  const logOverlay    = document.getElementById('logOverlay');
  const closeLogBtn   = document.getElementById('closeLogBtn');
  const subjectName   = document.getElementById('subjectName');
  const addSubjectBtn = document.getElementById('addSubjectBtn');
  const subjectList   = document.getElementById('subjectList');
  const logList       = document.getElementById('logList');

  function renderSubjects() {
    subjectList.innerHTML = '';
    subjects.forEach((name, i) => {
      const chip = document.createElement('span');
      chip.className = 'custom-chip';
      const n = document.createElement('span'); n.className = 'name'; n.textContent = name;
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
      del.addEventListener('click', () => { subjects.splice(i, 1); saveSubjects(); renderSubjects(); renderLog(); });
      chip.appendChild(n); chip.appendChild(del);
      subjectList.appendChild(chip);
    });
  }

  function addSubject() {
    const v = subjectName.value.trim();
    if (!v) return;
    if (!subjects.includes(v)) subjects.push(v);
    saveSubjects();
    subjectName.value = '';
    renderSubjects();
    renderLog();
  }
  addSubjectBtn.addEventListener('click', addSubject);
  subjectName.addEventListener('keydown', (e) => { if (e.key === 'Enter') addSubject(); });

  function renderLog() {
    const items = logEntries.slice(-60).reverse();   // 直近60件、新しい順
    if (items.length === 0) { logList.innerHTML = `<div class="custom-empty">${t('noLog')}</div>`; return; }
    logList.innerHTML = '';
    items.forEach(e => {
      const d = new Date(e.end);
      const time = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      const row = document.createElement('div'); row.className = 'log-row';
      const meta = document.createElement('span'); meta.className = 'log-meta'; meta.textContent = `${time} · ${e.min}m`;
      const sel = document.createElement('select');
      const optNone = document.createElement('option'); optNone.value = ''; optNone.textContent = t('unset'); sel.appendChild(optNone);
      subjects.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
      if (e.label && !subjects.includes(e.label)) { const o = document.createElement('option'); o.value = e.label; o.textContent = e.label; sel.appendChild(o); }
      sel.value = e.label || '';
      sel.addEventListener('change', () => { e.label = sel.value; saveLog(); });   // 「この時間はコレをやった」を後から登録
      row.appendChild(meta); row.appendChild(sel);
      logList.appendChild(row);
    });
  }

  logBtn.addEventListener('click', () => { renderSubjects(); renderLog(); logOverlay.classList.add('open'); });
  closeLogBtn.addEventListener('click', () => logOverlay.classList.remove('open'));
  logOverlay.addEventListener('click', (e) => { if (e.target === logOverlay) logOverlay.classList.remove('open'); });

  // ===== 休憩設定 =====
  const brkShortInput = document.getElementById('brkShortInput');
  const brkLongInput  = document.getElementById('brkLongInput');
  const brkEveryInput = document.getElementById('brkEveryInput');
  function fillBreakInputs() {
    brkShortInput.value = brk.short;
    brkLongInput.value  = brk.long;
    brkEveryInput.value = brk.every;
  }
  function readBreakInputs() {
    brk.short = Math.max(1, Math.min(60,  parseInt(brkShortInput.value, 10) || DEFAULT_BREAK.short));
    brk.long  = Math.max(1, Math.min(120, parseInt(brkLongInput.value, 10)  || DEFAULT_BREAK.long));
    brk.every = Math.max(1, Math.min(12,  parseInt(brkEveryInput.value, 10) || DEFAULT_BREAK.every));
    saveBreak();
    fillBreakInputs();   // 範囲補正を反映
  }
  [brkShortInput, brkLongInput, brkEveryInput].forEach(el => el.addEventListener('change', readBreakInputs));

  // ===== バックアップ（書き出し／読み込み）=====
  const BACKUP_KEYS = ['pomo_completed','pomo_focus_sec','pomo_xp','pomo_daily','pomo_log','pomo_subjects','pomo_dist','pomo_customs','pomo_lang','pomo_pro','pomo_break','pomo_histRange','pomo_norankpopup'];
  const exportBtn  = document.getElementById('exportBtn');
  const importBtn  = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');

  exportBtn.addEventListener('click', () => {
    const data = { app: 'pomodoro', version: 1 };
    BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) data[k] = v; });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pomodoro-backup.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', () => {
    const file = importFile.files && importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || data.app !== 'pomodoro') throw new Error('bad');
        BACKUP_KEYS.forEach(k => { if (typeof data[k] === 'string') localStorage.setItem(k, data[k]); });
        alert(t('importOk'));
        location.reload();
      } catch (e) {
        alert(t('importErr'));
      }
    };
    reader.readAsText(file);
    importFile.value = '';
  });

  // ===== 目標・音・昇格演出の設定 =====
  const goalUnitSel = document.getElementById('goalUnitSel');
  const goalInput   = document.getElementById('goalInput');
  const soundToggle = document.getElementById('soundToggle');
  const volSlider   = document.getElementById('volSlider');
  const levelupSel  = document.getElementById('levelupSel');

  // セレクタの選択肢ラベルを現在言語で再構築（applyLang から呼ばれる）
  function refreshSelectLabels() {
    goalUnitSel.innerHTML = `<option value="count">${t('unitCount')}</option><option value="min">${t('unitMin')}</option>`;
    goalUnitSel.value = dailyGoal.unit;
    levelupSel.innerHTML = `<option value="sparkle">${t('lvSparkle')}</option><option value="subtle">${t('lvSubtle')}</option><option value="confetti">${t('lvConfetti')}</option>`;
    levelupSel.value = levelupStyle;
    themeSel.innerHTML = `<option value="dark">${t('themeDark')}</option><option value="light">${t('themeLight')}</option>`;
    themeSel.value = theme;
  }

  function fillFeatInputs() {
    goalInput.value = dailyGoal.value;
    soundToggle.checked = soundOn;
    volSlider.value = soundVol;
  }

  goalUnitSel.addEventListener('change', () => { dailyGoal.unit = goalUnitSel.value; saveGoal(); renderGoal(); });
  goalInput.addEventListener('change', () => {
    dailyGoal.value = Math.max(1, Math.min(999, parseInt(goalInput.value, 10) || 8));
    goalInput.value = dailyGoal.value; saveGoal(); renderGoal();
  });
  soundToggle.addEventListener('change', () => { soundOn = soundToggle.checked; localStorage.setItem('pomo_sound', soundOn ? '1' : '0'); });
  volSlider.addEventListener('change', () => { soundVol = parseInt(volSlider.value, 10) || 0; localStorage.setItem('pomo_vol', String(soundVol)); beep('start'); });
  levelupSel.addEventListener('change', () => {
    levelupStyle = levelupSel.value;
    localStorage.setItem('pomo_lvfx', levelupStyle);
    showRankUp(Math.max(1, rankIndexFor(totalFocusMin())), true);   // 選んだ演出をその場でプレビュー
  });

  // ===== テーマ・アクセント =====
  const themeSel  = document.getElementById('themeSel');
  const accentRow = document.getElementById('accentRow');
  function markAccent() { [...accentRow.children].forEach(b => b.classList.toggle('on', b.dataset.accent === accent)); }
  themeSel.addEventListener('change', () => { theme = themeSel.value; localStorage.setItem('pomo_theme', theme); applyTheme(); });
  [...accentRow.children].forEach(b => b.addEventListener('click', () => {
    accent = b.dataset.accent; localStorage.setItem('pomo_accent', accent); applyTheme(); markAccent();
  }));

  // ===== オンボーディング（初回起動の案内）=====
  const onboardOverlay = document.getElementById('onboardOverlay');
  const obIco = document.getElementById('obIco');
  const obTitle = document.getElementById('obTitle');
  const obBody = document.getElementById('obBody');
  const obDots = document.getElementById('obDots');
  const obNextBtn = document.getElementById('obNextBtn');
  const obSkipBtn = document.getElementById('obSkipBtn');
  const helpLink = document.getElementById('helpLink');
  const OB_ICONS = ['🍅', '🔁', '🏅'];
  let obIndex = 0;
  function obSlides() { return (I18N[lang] && I18N[lang].obSlides) || I18N.en.obSlides; }
  function renderOnboard() {
    const slides = obSlides();
    const s = slides[obIndex] || slides[0];
    obIco.textContent = OB_ICONS[obIndex] || '🍅';
    obTitle.textContent = s[0];
    obBody.textContent = s[1];
    obDots.innerHTML = slides.map((_, i) => `<i class="${i === obIndex ? 'on' : ''}"></i>`).join('');
    obNextBtn.textContent = (obIndex >= slides.length - 1) ? t('obStart') : t('obNext');
  }
  function openOnboard() { obIndex = 0; renderOnboard(); onboardOverlay.classList.add('open'); }
  function closeOnboard() { onboardOverlay.classList.remove('open'); localStorage.setItem('pomo_onboarded', '1'); }
  obNextBtn.addEventListener('click', () => {
    if (obIndex >= obSlides().length - 1) closeOnboard();
    else { obIndex++; renderOnboard(); }
  });
  obSkipBtn.addEventListener('click', closeOnboard);
  onboardOverlay.addEventListener('click', (e) => { if (e.target === onboardOverlay) closeOnboard(); });
  helpLink.addEventListener('click', () => { settings.classList.remove('open'); openOnboard(); });

  applyTheme();
  fillBreakInputs();
  fillFeatInputs();
  renderRankBadge();
  applyLang();   // updateUI / updateCount / renderGoal / refreshSelectLabels もここで実行される
  updateMean();
  if (!localStorage.getItem('pomo_onboarded')) openOnboard();   // 初回だけ案内
</script>

<script>
  // PWA: Service Worker 登録（オフライン＆ホーム追加用）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
